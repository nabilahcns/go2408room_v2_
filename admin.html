<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GO2408ROOM Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef5ff;
  color:#172033
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.top{
  background:#fff;
  border-bottom:1px solid #dbe5f2;
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:5
}

.logo{font-weight:800;font-size:20px}
.sub{font-size:12px;color:#718096;margin-top:3px}

.btn{
  border:0;
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
  background:#1f6feb;
  color:#fff
}
.btn.gray{background:#e8eef7;color:#25344d}
.btn.red{background:#dc2626}
.btn.green{background:#16a34a}

.wrap{
  max-width:1180px;
  margin:24px auto;
  padding:0 18px
}

.lead{color:#66758b}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-top:18px
}

.card{
  background:#fff;
  border:1px solid #dbe5f2;
  border-radius:18px;
  padding:20px;
  min-height:135px;
  text-align:left;
  box-shadow:0 5px 20px #2030400b
}

.card:hover{border-color:#8eb8f7}

.card h3{margin:0 0 7px}

.card p{
  margin:0;
  color:#718096;
  font-size:14px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:20px 0
}

.stat{
  background:#fff;
  border:1px solid #dbe5f2;
  border-radius:15px;
  padding:15px
}

.stat b{
  font-size:24px;
  display:block;
  margin-top:4px
}

.modal{
  position:fixed;
  inset:0;
  background:#14203399;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:10
}

.modal.show{display:flex}

.box{
  background:#fff;
  width:min(1050px,100%);
  max-height:94vh;
  overflow:auto;
  border-radius:22px;
  padding:24px
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:start
}

.x{
  border:0;
  background:#edf2f7;
  border-radius:50%;
  width:36px;
  height:36px
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px
}

.menu button{
  text-align:left;
  background:#f6f9fd;
  border:1px solid #dce6f2;
  border-radius:15px;
  padding:16px
}

.menu b{
  display:block;
  margin-bottom:5px
}

.menu span{
  font-size:13px;
  color:#718096
}

.form{
  display:grid;
  gap:13px;
  margin-top:16px
}

.field{
  display:grid;
  gap:7px
}

label{
  font-size:13px;
  font-weight:700
}

input,textarea,select{
  width:100%;
  border:1px solid #ccd8e7;
  border-radius:11px;
  padding:11px;
  background:#fff
}

textarea{
  min-height:90px;
  resize:vertical
}

.actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:16px;
  flex-wrap:wrap
}

.customer,.item{
  border:1px solid #dbe5f2;
  border-radius:14px;
  padding:13px;
  margin-top:10px;
  background:#fbfdff
}

.customer-grid{
  display:grid;
  grid-template-columns:1fr 1.5fr .8fr auto;
  gap:10px;
  align-items:end
}

.remove{
  background:#fee2e2;
  color:#991b1b;
  border:0;
  border-radius:10px;
  padding:11px 12px
}

.upload{
  border:1px dashed #a9bad1;
  padding:13px;
  border-radius:13px;
  background:#f8fbff
}

.preview{
  display:none;
  max-width:220px;
  max-height:160px;
  margin-top:9px;
  border-radius:10px;
  object-fit:cover
}

.status{
  font-size:13px;
  color:#66758b
}

.ok{color:#15803d}
.err{color:#b91c1c}

.table-wrap{
  overflow:auto;
  border:1px solid #dbe5f2;
  border-radius:14px;
  margin-top:12px
}

.tbl{
  width:100%;
  border-collapse:collapse;
  min-width:900px
}

.tbl th,.tbl td{
  padding:9px;
  border-bottom:1px solid #e4ebf3;
  text-align:left;
  font-size:12px;
  vertical-align:top
}

.tbl th{background:#f4f7fb}

.pill{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  background:#edf2f7;
  font-size:11px;
  font-weight:700
}

.searchrow{
  display:flex;
  gap:8px;
  margin-top:12px
}

.searchrow input{flex:1}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.small{font-size:11px}

.imgthumb{
  width:74px;
  height:52px;
  object-fit:cover;
  border-radius:8px;
  background:#edf2f7
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.loginbox{
  width:min(420px,100%);
  background:#fff;
  border-radius:22px;
  padding:28px;
  box-shadow:0 15px 50px #20304018
}

.hidden{display:none!important}

.danger{
  background:#fff1f2;
  border:1px solid #fecdd3;
  padding:12px;
  border-radius:12px
}

.success{
  background:#ecfdf5;
  border:1px solid #bbf7d0;
  padding:12px;
  border-radius:12px
}

.muted{color:#718096}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}

@media(max-width:780px){
  .cards,.menu,.two,.stats{
    grid-template-columns:1fr 1fr
  }

  .customer-grid{
    grid-template-columns:1fr
  }

  .tbl{
    min-width:760px
  }
}

@media(max-width:520px){
  .cards,.menu,.two,.stats{
    grid-template-columns:1fr
  }

  .top{
    padding:12px 14px
  }

  .searchrow{
    flex-direction:column
  }
}
</style>
</head>

<body>

<div id="loginView" class="login">
  <div class="loginbox">
    <h1>GO2408ROOM</h1>
    <p class="lead">Admin Login</p>

    <form id="loginForm" class="form">

      <div class="field">
        <label>Username</label>
        <input id="username" required>
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" required>
      </div>

      <button class="btn">LOGIN</button>

      <div id="loginStatus" class="status"></div>

    </form>
  </div>
</div>


<div id="app" class="hidden">

<header class="top">

  <div>
    <div class="logo">GO2408ROOM Admin</div>
    <div class="sub">
      Manage GO, Jastip, Payment & Order Database
    </div>
  </div>

  <button id="logoutBtn" class="btn gray">
    Logout
  </button>

</header>


<main class="wrap">

<h1>Dashboard</h1>

<p class="lead">
Semua fungsi admin dikembalikan di sini.
Data utama tersimpan di database,
sedangkan order utama tetap membaca Google Sheets.
</p>


<div class="stats">

  <div class="stat">
    Payment Batch
    <b id="stBatches">—</b>
  </div>

  <div class="stat">
    Menunggu Verifikasi
    <b id="stPending">—</b>
  </div>

  <div class="stat">
    Order di Sheets
    <b id="stOrders">—</b>
  </div>

  <div class="stat">
    Content Admin
    <b id="stContent">—</b>
  </div>

</div>


<div class="cards">

  <button class="card" onclick="openService('super')">
    <h3>GO Super Jajan</h3>
    <p>
      Update order/status, Payment Batch,
      Album Arrived, Link CO & data.
    </p>
  </button>


  <button class="card" onclick="openService('efensi')">
    <h3>GO Efensi Stan</h3>
    <p>
      Update order/status, Payment Batch,
      Album Arrived, Link CO & data.
    </p>
  </button>


  <button class="card" onclick="openService('concert')">
    <h3>Jastip Tiket Konser</h3>
    <p>
      Jadwal konser, Bookslot,
      Form Jastip & data.
    </p>
  </button>


  <button class="card" onclick="openService('jastip')">
    <h3>Jastip 2408roomstore</h3>
    <p>
      Update order/status, Payment Batch,
      Link CO & data.
    </p>
  </button>


  <button class="card" onclick="openOrderDatabase()">
    <h3>📊 Order Database / Google Sheets</h3>
    <p>
      Lihat seluruh order, cari customer,
      edit row & buka Google Sheet asli.
    </p>
  </button>


  <button class="card" onclick="openPaymentVerification()">
    <h3>💳 Verifikasi Pembayaran</h3>
    <p>
      Lihat semua bukti payment masuk,
      approve/reject tanpa bergantung browser cache.
    </p>
  </button>

</div>

</main>

</div>


<div id="modal" class="modal">

  <div class="box">

    <div class="head">

      <div>
        <h2 id="modalTitle"></h2>
        <p id="modalSub" class="lead"></p>
      </div>

      <button
        class="x"
        onclick="closeModal()">
        ✕
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>


<script>

const SERVICE_NAMES = {
  super:'GO Super Jajan',
  efensi:'GO Efensi Stan',
  concert:'Jastip Tiket Konser',
  jastip:'Jastip 2408roomstore'
};


let activeService = '';
let customerCount = 0;
let orderCache = [];

let orderMeta = {
  columns:{},
  headers:[],
  sheetName:'REKAPAN'
};


const $ = id =>
  document.getElementById(id);


const esc = s =>
  String(s ?? '')
  .replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );


const money = n => {

  const s = String(n ?? '').trim();

  return s && /\d/.test(s)
    ? (
        s.startsWith('Rp')
        ? s
        : 'Rp ' +
          Number(
            s.replace(/[^\d.-]/g,'') || 0
          ).toLocaleString('id-ID')
      )
    : '-';

};


async function api(url,opt={}){

  const r = await fetch(
    url,
    {
      credentials:'include',
      ...opt
    }
  );

  const d =
    await r.json().catch(() => ({}));

  if(!r.ok)
    throw Error(
      d.error || 'Request gagal'
    );

  return d;
}


async function checkAuth(){

  try{

    await api('/api/auth');

    showApp();

    loadStats();

  }catch{

    showLogin();

  }

}


function showLogin(){

  $('loginView')
    .classList
    .remove('hidden');

  $('app')
    .classList
    .add('hidden');

}


function showApp(){

  $('loginView')
    .classList
    .add('hidden');

  $('app')
    .classList
    .remove('hidden');

}


$('loginForm').onsubmit =
async e => {

  e.preventDefault();

  $('loginStatus')
    .textContent =
    'Memproses...';

  try{

    await api(
      '/api/auth',
      {
        method:'POST',
        headers:{
          'Content-Type':
          'application/json'
        },
        body:JSON.stringify({
          username:
          $('username').value,
          password:
          $('password').value
        })
      }
    );

    showApp();
    loadStats();

  }catch(x){

    $('loginStatus')
      .className =
      'status err';

    $('loginStatus')
      .textContent =
      x.message;

  }

};


$('logoutBtn').onclick =
async () => {

  await api(
    '/api/auth',
    {
      method:'DELETE'
    }
  );

  location.reload();

};


function openService(s){

  activeService = s;

  $('modalTitle')
    .textContent =
    SERVICE_NAMES[s];

  $('modalSub')
    .textContent =
    'Pilih menu admin';

  let m = '';

  if(s !== 'concert'){

    m = `

    <div class="menu">

      <button onclick="openForm('update')">
        <b>📝 Update Jajan / Order</b>
        <span>
          Atur status/order customer dari database.
        </span>
      </button>


      <button onclick="openForm('payment')">
        <b>💳 Payment Batch</b>
        <span>
          Satu batch bisa berisi banyak customer.
        </span>
      </button>


      ${
        s !== 'jastip'
        ? `
        <button onclick="openForm('arrived')">
          <b>📦 Album Arrived INA</b>
          <span>
            Upload foto dan catatan barang tiba.
          </span>
        </button>
        `
        : ''
      }


      <button onclick="openForm('link')">
        <b>🔗 Link CO</b>
        <span>
          Simpan link checkout aktif.
        </span>
      </button>


      <button onclick="openDataList()">
        <b>📋 Lihat Data</b>
        <span>
          Lihat data tersimpan di database.
        </span>
      </button>


      <button onclick="openPaymentVerification()">
        <b>✅ Verifikasi Payment</b>
        <span>
          Approve/reject bukti pembayaran.
        </span>
      </button>

    </div>

    `;

  }else{

    m = `

    <div class="menu">

      <button onclick="openForm('schedule')">
        <b>📅 Jadwal Konser</b>
        <span>
          Tambah jadwal konser.
        </span>
      </button>


      <button onclick="openForm('bookslot')">
        <b>🎟️ Form Bookslot</b>
        <span>
          Input URL form bookslot.
        </span>
      </button>


      <button onclick="openForm('concertform')">
        <b>📝 Form Jastip Tiket</b>
        <span>
          Input URL form jastip.
        </span>
      </button>


      <button onclick="openDataList()">
        <b>📋 Lihat Data</b>
        <span>
          Lihat data konser yang tersimpan.
        </span>
      </button>

    </div>

    `;

  }

  $('modalBody').innerHTML = m;

  $('modal')
    .classList
    .add('show');

}


function closeModal(){

  $('modal')
    .classList
    .remove('show');

}


function back(){

  return `
    <div class="actions">
      <button
        type="button"
        class="btn gray"
        onclick="openService('${activeService}')">
        ← Kembali
      </button>
    </div>
  `;

}


function openForm(t){

  const titles = {

    payment:'Payment Batch',
    update:'Update Jajan / Order',
    arrived:'Album Arrived INA',
    link:'Link CO',
    schedule:'Jadwal Konser',
    bookslot:'Form Bookslot',
    concertform:'Form Jastip Tiket'

  };

  $('modalTitle')
    .textContent =
    titles[t];

  $('modalSub')
    .textContent =
    SERVICE_NAMES[activeService];

  ({
    payment:paymentForm,
    update:updateForm,
    arrived:arrivedForm,
    link:linkForm,
    schedule:scheduleForm,
    bookslot:bookslotForm,
    concertform:concertForm
  }[t])();

}


function fileField(id,label,required=false){

  return `

    <div class="field">

      <label>
        ${label}
        ${required ? ' *' : ''}
      </label>

      <div class="upload">

        <input
          id="${id}"
          type="file"
          accept="image/*"
          ${required ? 'required' : ''}
        >

        <div
          id="${id}Status"
          class="status">
        </div>

        <img
          id="${id}Preview"
          class="preview"
        >

      </div>

    </div>

  `;

}


function preview(id){

  const f =
    $(id).files[0];

  if(f){

    $(id+'Preview')
      .src =
      URL.createObjectURL(f);

    $(id+'Preview')
      .style
      .display =
      'block';

  }

}


async function uploadFile(file,statusId){

  if(!file)
    return '';

  $(statusId)
    .textContent =
    'Uploading...';

  const d =
    await api(
      '/api/upload',
      {
        method:'POST',
        headers:{
          'Content-Type':
          'application/json'
        },
        body:JSON.stringify({
          filename:file.name
        })
      }
    );

  const put =
    await fetch(
      d.signedUrl,
      {
        method:'PUT',
        headers:{
          'Content-Type':
          file.type ||
          'application/octet-stream'
        },
        body:file
      }
    );

  if(!put.ok)
    throw Error(
      'Gagal upload file'
    );

  $(statusId)
    .className =
    'status ok';

  $(statusId)
    .textContent =
    '✓ Upload berhasil';

  return d.path;

}


function paymentForm(){

  customerCount = 0;

  $('modalBody').innerHTML = `

    <form
      id="paymentForm"
      class="form">

      <div class="field">

        <label>Nama Batch *</label>

        <input
          id="batchName"
          placeholder="Contoh: SJ Fancon Japan — Batch 03"
          required>

      </div>


      ${fileField(
        'batchPhoto',
        'Foto Batch',
        true
      )}


      ${fileField(
        'qrisPhoto',
        'Foto QRIS',
        true
      )}


      <div>

        <label>List Customer</label>

        <div id="customers"></div>

        <button
          type="button"
          class="btn gray"
          style="margin-top:10px"
          onclick="addCustomer()">
          ＋ Tambah Customer
        </button>

      </div>


      <div
        id="saveStatus"
        class="status">
      </div>


      ${back()}


      <div class="actions">

        <button
          class="btn"
          type="submit">
          Simpan Batch
        </button>

      </div>

    </form>

  `;

  addCustomer();

  $('batchPhoto').onchange =
    () => preview('batchPhoto');

  $('qrisPhoto').onchange =
    () => preview('qrisPhoto');

  $('paymentForm').onsubmit =
    savePaymentBatch;

}


function addCustomer(){

  const id =
    ++customerCount;

  const d =
    document.createElement('div');

  d.className =
    'customer';

  d.id =
    'customer-' + id;

  d.innerHTML = `

    <div class="customer-grid">

      <div class="field">
        <label>Nama</label>
        <input
          class="c-name"
          required>
      </div>


      <div class="field">
        <label>Barang / Jajanan</label>
        <input
          class="c-items"
          required>
      </div>


      <div class="field">
        <label>Total</label>
        <input
          class="c-total"
          type="number"
          min="0"
          required>
      </div>


      <button
        type="button"
        class="remove"
        onclick="removeCustomer(${id})">
        Hapus
      </button>

    </div>

  `;

  $('customers')
    .appendChild(d);

}


function removeCustomer(id){

  if(
    document.querySelectorAll('.customer')
    .length <= 1
  ){

    return alert(
      'Minimal 1 customer.'
    );

  }

  $('customer-'+id)
    .remove();

}


async function savePaymentBatch(e){

  e.preventDefault();

  const st =
    $('saveStatus');

  st.textContent =
    'Menyimpan...';

  try{

    const bp =
      $('batchPhoto').files[0];

    const qr =
      $('qrisPhoto').files[0];

    if(!bp || !qr){

      throw Error(
        'Foto batch dan QRIS wajib diupload.'
      );

    }

    const batchPhoto =
      await uploadFile(
        bp,
        'batchPhotoStatus'
      );

    const qris =
      await uploadFile(
        qr,
        'qrisPhotoStatus'
      );

    const customers =
      [...document.querySelectorAll('.customer')]
      .map(x => ({
        name:
        x.querySelector('.c-name')
        .value
        .trim(),

        items:
        x.querySelector('.c-items')
        .value
        .trim(),

        total:
        Number(
          x.querySelector('.c-total')
          .value
        ),

        paymentStatus:
        'Belum Bayar'
      }));


    await api(
      '/api/batches',
      {
        method:'POST',
        headers:{
          'Content-Type':
          'application/json'
        },
        body:JSON.stringify({
          id:Date.now(),
          service:activeService,
          batch:
          $('batchName')
          .value
          .trim(),

          batchPhoto,
          qris,
          customers,

          createdAt:
          new Date()
          .toISOString()
        })
      }
    );


    st.className =
      'status ok';

    st.textContent =
      `✓ Batch tersimpan (${customers.length} customer).`;

    loadStats();

  }catch(x){

    st.className =
      'status err';

    st.textContent =
      x.message;

  }

}


async function updateForm(){

  $('modalBody').innerHTML = `

    <div class="searchrow">

      <input
        id="ouSearch"
        placeholder="Cari nama customer di Google Sheets">

      <button
        class="btn"
        onclick="findOrderForUpdate()">
        Cari
      </button>

    </div>


    <div
      id="ouResult"
      class="form">

      <div class="lead">
        Cari nama dulu untuk memastikan
        row customer yang akan di-update.
      </div>

      ${back()}

    </div>

  `;

}


async function findOrderForUpdate(){

  const n =
    $('ouSearch')
    .value
    .trim();

  if(!n)
    return;

  const box =
    $('ouResult');

  box.innerHTML =
    '<div class="status">Mencari...</div>';

  try{

    const d =
      await api(
        '/api/orders?name=' +
        encodeURIComponent(n)
      );

    const o =
      d.orders?.[0];

    if(!o){

      box.innerHTML =
        '<div class="danger">Customer tidak ditemukan.</div>' +
        back();

      return;

    }


    box.innerHTML = `

      <form
        id="ouForm"
        class="form">

        <div class="success">

          <b>${esc(o.name)}</b>

          <br>

          <span class="small">
            Google Sheets row ${o.rowNumber}
          </span>

        </div>

async function openDataList(){

  $('modalTitle')
    .textContent =
    'Data Tersimpan';

    .textContent =
    SERVICE_NAMES[activeService];

  $('modalBody').innerHTML =
    back() +
    '<div class="status">Memuat...</div>';


  try{

    const [
      c,
      b
    ] =
    await Promise.all([
      api('/api/content'),
      api('/api/batches')
    ]);


    const items =
      (c.items || [])
      .filter(
        x =>
        x.service === activeService
      );


    const batches =
      (b.batches || [])
      .filter(
        x =>
        x.service === activeService
      );


    let h = back();


    h += `

    h +=
      batches.length
      ? batches
          .map(batchCard)
          .join('')
      : `
        <p class="lead">
          Belum ada batch.
        </p>
      `;


    h += `
      <h3 style="margin-top:22px">
        📝 Content
      </h3>
    `;


    h +=
      items.length
      ? items
          .map(
            x => `

              <div class="item">

                <b>
                  ${esc(x.title)}
                </b>

                <div class="status">
                  ${esc(x.type)}
                  ${esc(x.date || '')}
                  ${esc(x.venue || '')}
                </div>

                <div>
                  ${esc(x.note || '')}
                </div>

                ${
                  x.url
                  ? `

                      ${esc(x.url)}

                  `

                }

                <div
                  class="actions"

                  <button

            `

          .join('')
      : `
        <p class="lead">

    $('modalBody').innerHTML =

  }catch(e){

    $('modalBody').innerHTML =
      back() +
      `
      <div class="status err">
        ${esc(e.message)}

  }

async function verifyPayment(
  id,
  status
){

  let note = '';

  if(
    status === 'rejected'
  ){

    note =
      prompt(
        'Alasan reject (opsional):'
      ) || '';

  }


  try{

    await api(
      '/api/payment-proof',
      {
        method:'PATCH',
        headers:{
          'Content-Type':
          'application/json'
        },
        body:JSON.stringify({
          id,
          status,
          note
        })
      }
    );


    openPaymentVerification();

    loadStats();

  }catch(e){

    alert(
      e.message
    );

  }

}

    renderOrders(
      orderCache,
      d.headers || []
    );


  }catch(e){

    box.innerHTML =
      `
      <div
        style="padding:14px"
        class="status err">
        ${esc(e.message)}
      </div>
      `;

  }

}


async function searchOrdersAdmin(){

  const q =
    $('odSearch')
    .value
    .trim();


  if(!q){

    return renderOrders(
      orderCache,
      []
    );

  }


  try{

    const d =
      await api(
        '/api/orders?name=' +
        encodeURIComponent(q)
      );


    renderOrders(
      d.orders || [],
      d.headers || []
    );

  }catch(e){

    alert(
      e.message
    );

  }

}


function renderOrders(
  rows,
  headers
){

  if(!rows.length){

    $('odBox').innerHTML =
      `
        <div
          style="padding:14px"
          class="status">
          Tidak ada data.
        </div>
      `;

    return;

  }


  const h = `

    <table class="tbl">

      <thead>

        <tr>

          <th>Row</th>
          <th>Nama</th>
          <th>List Barang</th>
          <th>Negara</th>
          <th>Grup Order</th>
          <th>Kode</th>
          <th>Update</th>
          <th>Total Due</th>
          <th>Website Status</th>
          <th>Aksi</th>

        </tr>

      </thead>


      <tbody>

        ${
          rows
          .map(
            o => `

              <tr>

                <td>
                  ${o.rowNumber}
                </td>


                <td>
                  <b>
                    ${esc(o.name)}
                  </b>
                </td>


                <td>
                  ${esc(o.item)}
                </td>


                <td>
                  ${esc(o.country)}
                </td>


                <td>
                  ${esc(o.group)}
                </td>


                <td>
                  ${esc(o.code)}
                </td>


                <td>
                  ${esc(o.update)}
                </td>


                <td>
                  ${money(o.total)}
                </td>


                <td>

                  <span class="pill">
                    ${esc(
                      o.status || ''
                    )}
                  </span>

                </td>


                <td>

                  <button
                    class="btn gray"
                    onclick='editOrder(
                      ${JSON.stringify(o)
                        .replace(
                          /'/g,
                          "&#39;"
                        )}
                    )'>
                    Edit
                  </button>

                </td>

              </tr>

            `
          )
          .join('')
        }

      </tbody>

    </table>

  `;


  $('odBox').innerHTML =
    h;

}


function editOrder(o){

  activeService = '';

  $('modalTitle')
    .textContent =
    'Edit Order';

  $('modalSub')
    .textContent =
    `${o.name} — Google Sheets row ${o.rowNumber}`;


  $('modalBody').innerHTML = `

    <form
      id="editOrderForm"
      class="form">


      <div class="two">


        <div class="field">

          <label>Nama</label>

          <input
            id="xName"
            value="${esc(o.name)}"
            disabled>

        </div>


        <div class="field">

          <label>List Barang</label>

          <input
            id="xItem"
            value="${esc(o.item)}">

        </div>


        <div class="field">

          <label>Negara</label>

          <input
            id="xCountry"
            value="${esc(o.country)}">

        </div>


        <div class="field">

          <label>Grup Order</label>

          <input
            id="xGroup"
            value="${esc(o.group)}">

        </div>


        <div class="field">

          <label>Kode</label>

          <input
            id="xCode"
            value="${esc(o.code)}">

        </div>


        <div class="field">

          <label>
            Total Payment Due
          </label>

          <input
            id="xTotal"
            value="${esc(o.total)}">

        </div>

      </div>


      <div class="field">

        <label>
          Update Payment
        </label>

        <textarea id="xUpdate">
${esc(o.update)}
        </textarea>

      </div>


      <div class="field">

        <label>Detail</label>

        <textarea id="xDetail">
${esc(o.detail)}
        </textarea>

      </div>


      <div
        id="xStatus"
        class="status">
      </div>


      <div class="actions">

        <button
          type="button"
          class="btn gray"
          onclick="openOrderDatabase()">
          Batal
        </button>


        <button class="btn">
          Simpan ke Google Sheets
        </button>

      </div>

    </form>

  `;


  $('editOrderForm').onsubmit =
  async e => {

    e.preventDefault();

    const st =
      $('xStatus');


    try{

      const vals =
        [...o.raw];

      const idx =
        orderMeta.columns || {};


      vals[idx.item] =
        $('xItem').value;

      vals[idx.country] =
        $('xCountry').value;

      vals[idx.group] =
        $('xGroup').value;

      vals[idx.code] =
        $('xCode').value;

      vals[idx.update] =
        $('xUpdate').value;

      vals[idx.total] =
        $('xTotal').value;

      vals[idx.detail] =
        $('xDetail').value;


      await api(
        '/api/sheets',
        {
          method:'POST',
          headers:{
            'Content-Type':
            'application/json'
          },
          body:JSON.stringify({

            rowNumber:
            o.rowNumber,

            values:
            vals,

            sheetName:
            orderMeta.sheetName

          })
        }
      );


      st.className =
        'status ok';

      st.textContent =
        '✓ Google Sheets berhasil diperbarui';


    }catch(x){

      st.className =
        'status err';

      st.textContent =
        x.message;

    }

  };

}


async function loadStats(){

  try{

    const [
      b,
      s,
      c,
      o
    ] =
    await Promise.all([

      api('/api/batches'),

      api('/api/payment-proof'),

      api('/api/content'),

      api('/api/orders')

    ]);


    $('stBatches')
      .textContent =
      (b.batches || [])
      .length;


    $('stPending')
      .textContent =
      (s.submissions || [])
      .filter(
        x =>
        x.status === 'pending'
      )
      .length;


    $('stOrders')
      .textContent =
      (o.orders || [])
      .length;


    $('stContent')
      .textContent =
      (c.items || [])
      .length;


  }catch{}

}
